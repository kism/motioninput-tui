---
name: Publish PyPi

# Runs on a version tag. Publishes through PyPI trusted publishing (OIDC), no token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: "Build and publish release"
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
