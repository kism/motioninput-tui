---
name: Windows exe

on:
  push:
    branches:
      - main
      - test
    tags:
      - "v*"
    # GitHub skips path filters on tag pushes, so a release always builds.
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "scripts/nuitka_entry.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # the release step on tags
    env:
      # An editable install records only a .pth, so Nuitka cannot find the
      # package behind --include-distribution-metadata and refuses to build.
      UV_NO_EDITABLE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the project
        run: uv sync

      # MSVC is on the runner already; MinGW does not support Python 3.13+.
      # Distribution metadata keeps importlib.metadata.version() working in constants.py.
      - name: Build with Nuitka
        run: >
          uv run --with nuitka python -m nuitka
          --mode=onefile
          --msvc=latest
          --assume-yes-for-downloads
          --include-package-data=motioninput_tui
          --include-package=textual.widgets
          --include-distribution-metadata=motioninput-tui
          --output-dir=build
          --output-filename=motioninput-tui.exe
          scripts/nuitka_entry.py

      - name: Check the exe runs
        run: |
          build/motioninput-tui.exe --version
          build/motioninput-tui.exe --list

      - uses: actions/upload-artifact@v7
        with:
          name: motioninput-tui-windows
          path: build/motioninput-tui.exe
          # Only for trying a branch build; a tag's exe lives on the release.
          retention-days: 3

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} build/motioninput-tui.exe --clobber || gh release create ${{ github.ref_name }} build/motioninput-tui.exe --generate-notes
