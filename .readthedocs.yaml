# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Only mkdocs itself is installed here, not the project: the docs are plain
# pages with nothing generated from the code, and the project's own
# requires-python is ahead of what Read the Docs' build image offers.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
